name: factor_constrained_smoke
seed: 11
device: auto
dtype: float64
output_root: runs
model:
  name: affine_factor
  d: 5
  k: 1
  exact_one_factor: false
  market_mode: old_affine
  market_seed: 11
  T: 1.0
  n_steps: 8
  r: 0.03
  rho: 0.0
  gamma: 2.0
  terminal_weight: 1.0
  constraint: simplex
  leverage_cap: 1.0
  consumption: false
  wealth_range:
  - 0.3
  - 2.0
policy:
  kind: mlp
  hidden:
  - 48
  - 48
  activation: leaky_relu
training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.0003
  print_every: 1
evaluation:
  states: 3
  continuations: 128
  continuation_batch: 32
  graph_mode: ol
  antithetic: true
  state_seed: 1011
  brownian_seed: 2011
  holdout_continuations: 128
  holdout_continuation_batch: 32
  holdout_brownian_seed: 1002014
recovery:
  qp_tolerance: 1.0e-10
  curvature_floor: 1.0e-10
  barrier: true
  barrier_epsilon: 3.0e-06
