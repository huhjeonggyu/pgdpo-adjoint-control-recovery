name: merton_short_n100_full_shift
seed: 42
device: auto
dtype: float64
output_root: runs
model:
  name: merton
  d: 100
  T: 1.5
  n_steps: 20
  r: 0.03
  rho: 0.0
  gamma: 2.0
  terminal_weight: 1.0
  constraint: orthant
  consumption: false
  wealth_range:
  - 0.1
  - 3.0
  market_seed: 42
policy:
  kind: mlp
  hidden:
  - 200
  - 200
  activation: leaky_relu
training:
  epochs: 500
  batch_size: 1024
  learning_rate: 0.0001
  grad_clip: 1.0
  print_every: 25
evaluation:
  states: 128
  continuations: 8192
  continuation_batch: 128
  graph_mode: ol
  antithetic: false
  state_seed: 12345
  brownian_seed: 22345
  holdout_continuations: 8192
  holdout_continuation_batch: 128
  holdout_brownian_seed: 1022348
recovery:
  qp_tolerance: 1.0e-10
  curvature_floor: 1.0e-10
  barrier: true
  barrier_epsilon: 1.0e-06
  barrier_tolerance: 1.0e-08
  barrier_max_iterations: 120
